openapi: 3.0.3

info:
  title: MiniBlog API
  description: API REST para gestionar autores y publicaciones.
  version: 1.0.0

servers:
  - url: http://localhost:3000

paths:

  /authors:
    get:
      summary: Listar autores
      responses:
        "200":
          description: Lista de autores

    post:
      summary: Crear autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorInput"
      responses:
        "201":
          description: Autor creado
        "400":
          description: Datos inválidos

  /authors/{id}:
    get:
      summary: Obtener autor
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Autor encontrado
        "404":
          description: Autor no encontrado

    put:
      summary: Actualizar autor
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorInput"
      responses:
        "200":
          description: Autor actualizado
        "400":
          description: Datos inválidos
        "404":
          description: Autor no encontrado

    delete:
      summary: Eliminar autor
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Autor eliminado
        "404":
          description: Autor no encontrado

  /posts:
    get:
      summary: Listar posts
      responses:
        "200":
          description: Lista de posts

    post:
      summary: Crear post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "201":
          description: Post creado
        "400":
          description: Datos inválidos

  /posts/{id}:
    get:
      summary: Obtener post
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Post encontrado
        "404":
          description: Post no encontrado

    put:
      summary: Actualizar post
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostInput"
      responses:
        "200":
          description: Post actualizado
        "400":
          description: Datos inválidos
        "404":
          description: Post no encontrado

    delete:
      summary: Eliminar post
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Post eliminado
        "404":
          description: Post no encontrado

  /posts/author/{authorId}:
    get:
      summary: Obtener posts de un autor
      parameters:
        - name: authorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Posts del autor

components:

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:

    AuthorInput:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: Andy Ochoa
        email:
          type: string
          example: andy@example.com
        bio:
          type: string
          example: Desarrollador web

    PostInput:
      type: object
      required:
        - author_id
        - title
        - content
      properties:
        author_id:
          type: integer
          example: 1
        title:
          type: string
          example: Mi primer post
        content:
          type: string
          example: Contenido del post
        published:
          type: boolean
          example: true