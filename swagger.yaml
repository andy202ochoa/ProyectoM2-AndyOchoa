openapi: 3.0.3
info:
  title: PIM2 API
  description: API para el proyecto PIM2 — Authors y Posts
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor local de desarrollo
  - url: https://proyectom2-andyochoa-production.up.railway.app/
    description: Servidor de producción
paths:
  /authors:
    get:
      summary: Obtener lista de autores
      responses:
        '200':
          description: Lista de autores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      summary: Crear un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAuthor'
      responses:
        '201':
          description: Autor creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
  /authors/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Obtener un autor por id
      responses:
        '200':
          description: Autor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Autor no encontrado
    put:
      summary: Actualizar un autor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAuthor'
      responses:
        '200':
          description: Autor actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
    delete:
      summary: Eliminar un autor
      responses:
        '204':
          description: Autor eliminado
  /posts:
    get:
      summary: Obtener lista de posts
      responses:
        '200':
          description: Lista de posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
    post:
      summary: Crear un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '201':
          description: Post creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
  /posts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
    get:
      summary: Obtener un post por id
      responses:
        '200':
          description: Post encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post no encontrado
    put:
      summary: Actualizar un post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
      responses:
        '200':
          description: Post actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
    delete:
      summary: Eliminar un post
      responses:
        '204':
          description: Post eliminado
components:
  schemas:
    Author:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Gabriel García
        email:
          type: string
          format: email
          example: autor@example.com
      required:
        - id
        - name
        - email
    NewAuthor:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
      required:
        - name
        - email
    Post:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Un post interesante
        content:
          type: string
          example: Contenido del post
        authorId:
          type: integer
          example: 1
      required:
        - id
        - title
        - content
        - authorId
    NewPost:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        authorId:
          type: integer
      required:
        - title
        - content
        - authorId
